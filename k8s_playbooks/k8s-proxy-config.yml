# #Validate install:
# kubectl version

- name: Install kubectl and dependencies
  hosts: k8s-proxy
  become: true
  vars:
    kubectl_version: "v1.32.2"  # Define the desired version here

  tasks:
    - name: Update and upgrade the system
      apt:
        update_cache: yes
        upgrade: yes

    - name: Install required packages
      apt:
        name: python3-pip
        state: present

    - name: Download kubectl binary
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: "/usr/local/bin/kubectl"
        mode: '0755'

    - name: Download kubectl checksum
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl.sha256"
        dest: "/tmp/kubectl.sha256"

    - name: Verify checksum
      shell: "echo \"$(cat /tmp/kubectl.sha256)  /usr/local/bin/kubectl\" | sha256sum --check"
      register: checksum_result
      changed_when: false
      failed_when: "'OK' not in checksum_result.stdout"

    - name: Validate kubectl installation
      command: kubectl version --client
      register: kubectl_version_output
      changed_when: false

    - name: Debug kubectl version
      debug:
        msg: "{{ kubectl_version_output.stdout }}"
