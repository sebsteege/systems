- name: Deploy Home Assistant
  hosts: k8s-proxy
  become: yes

  tasks:

    - name: Copy home-ass.yml to k8s-proxy
      copy:
        src: home-ass.yml
        dest: /opt/application_manifests/home-assistant/home-ass.yml
        owner: ansible
        group: ansible
        mode: '0644'

    - name: Copy kustomization.yml to k8s-proxy
      copy:
        src: kustomization.yml
        dest: /opt/application_manifests/home-assistant/kustomization.yml
        owner: ansible
        group: ansible
        mode: '0644'

    - name: Install home-assistant
      ansible.builtin.shell: |
        kubectl apply --kubeconfig=/home/ansible/.kube/config -k /opt/application_manifests/home-assistant/
      register: res
      changed_when: res.rc != 0