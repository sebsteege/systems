- name: Deploy application
  hosts: k8s-proxy
  become: yes

  tasks:

    - name: Create a metallb from K8S YAML File
      kubernetes.core.k8s:
        state: present
        src: /home/ansible/gitlab_dev/cv-labs/k8s_playbooks/application_manifests/metallb.yml
        kubeconfig: /home/ansible/.kube/config
      register: result

    - name: Write deployment result to a log file
      copy:
        content: "{{ result | to_nice_json }}"
        dest: "/var/log/metallb-deploy.log"