    # Mount NFS Share

    - name: Ensure nfs-common is installed
      apt:
        name: nfs-common 
        state: present

    - name: Create a directory if it does not exist
      ansible.builtin.file:
        path: /mnt/truenas
        state: directory
        mode: '0755'

    - name: Mount NFS volumes
      ansible.posix.mount:
        src: 192.168.100.17:/mnt/Volume-01/Docker
        path: /mnt/truenas
        opts: rw
        state: mounted
        fstype: nfs
      when: inventory_hostname not in groups['pd-k8s-workers']

    - name: Mount kubernetes NFS volumes
      ansible.posix.mount:
        src: 192.168.100.17:/mnt/Volume-01/kubernetes
        path: /mnt/
        opts: rw
        state: mounted
        fstype: nfs
      when: inventory_hostname in groups['pd-k8s-workers']
---
- name: Deploy Truenas Volume
  hosts: k8s-proxy
  become: yes

  tasks:

    - name: Copy volume.yml to k8s-proxy
      copy:
        src: volume.yml
        dest: /opt/application_manifests/volume.yml
        owner: ansible
        group: ansible
        mode: '0644'

    - name: Create a volume from K8S YAML File
      kubernetes.core.k8s:
        state: present
        src: /opt/application_manifests/volume.yml
        kubeconfig: /home/ansible/.kube/config
      register: result

    - name: Write deployment result to a log file
      copy:
        content: "{{ result | to_nice_json }}"
        dest: "/var/log/volume-deploy.log"