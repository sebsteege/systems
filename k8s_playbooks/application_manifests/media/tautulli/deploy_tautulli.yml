- name: Install tautulli via kustomize
  hosts: k8s-proxy
  become: true

  tasks:

    - name: Copy tautulli.yml to k8s-proxy
      copy:
        src: tautulli.yml
        dest: /opt/application_manifests/tautulli/tautulli.yml
        owner: ansible
        group: ansible
        mode: '0644'

    - name: Copy kustomization.yml to k8s-proxy
      copy:
        src: kustomization.yml
        dest: /opt/application_manifests/tautulli/kustomization.yml
        owner: ansible
        group: ansible
        mode: '0644'

    - name: Install tautulli
      ansible.builtin.shell: |
        kubectl apply --kubeconfig=/home/ansible/.kube/config -k /opt/application_manifests/tautulli/
      register: res
      changed_when: res.rc != 0