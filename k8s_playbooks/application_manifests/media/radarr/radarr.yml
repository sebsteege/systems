---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr-deployment
  namespace: media
  labels:
    app: radarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
        - name: radarr
          image: docker.io/linuxserver/radarr:amd64-latest
          ports:
            - containerPort: 7878
          volumeMounts:
            - mountPath: /config
              subPath: configs/radarr-data
              name: media-pv
            - mountPath: /downloads
              subPath: downloads
              name: media-pv
            - mountPath: /movies
              name: media-pv
              subPath: library/movies
      volumes:
        - name: media-pv
          persistentVolumeClaim:
            claimName: media-pvc
---
kind: Service
apiVersion: v1
metadata:
  name: radarr-service
  namespace: media
spec:
  selector:
    app: radarr
  ports:
  - protocol: TCP
    port: 80
    targetPort: 7878
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr-ingress
  namespace: media
spec:
  ingressClassName: nginx
  rules:
  - host: radarr.cv-labs.net
    http:
      paths: 
      - path: /
        pathType: Prefix
        backend:
          service:
            name: radarr-service
            port:
              number: 80