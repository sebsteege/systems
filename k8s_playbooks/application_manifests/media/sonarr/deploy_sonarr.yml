- name: Deploy sonarr
  hosts: k8s-proxy
  become: yes

  tasks:

    - name: Copy sonarr.yml to k8s-proxy
      copy:
        src: sonarr.yml
        dest: /opt/application_manifests/sonarr/sonarr.yml
        owner: ansible
        group: ansible
        mode: '0644'

    - name: Copy kustomization.yml to k8s-proxy
      copy:
        src: kustomization.yml
        dest: /opt/application_manifests/sonarr/kustomization.yml
        owner: ansible
        group: ansible
        mode: '0644'

    - name: Install sonarr
      ansible.builtin.shell: |
        kubectl apply --kubeconfig=/home/ansible/.kube/config -k /opt/application_manifests/sonarr/
      register: res
      changed_when: res.rc != 0