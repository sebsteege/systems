version: '3.8'
services:
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000 # User ID
      - PGID=1000 # Group ID
      - TZ=America/New_York # Your timezone
    volumes:
      - /mnt/truenas/media/radarr/config/radarr-data:/config # Configuration files
      - /mnt/truenas/media/radarr/movies:/movies # Movie library
      - /mnt/truenas/media/downloads:/downloads # Download directory
    ports:
      - 7878:7878 # Radarr web UI port
    restart: unless-stopped