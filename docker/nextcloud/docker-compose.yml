services:
  nextcloud-db:
    container_name: nextcloud-db
    image: mariadb:10.6
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - /data/nextcloud-db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=SeaBass7!
      - MYSQL_PASSWORD=SeaBass7!
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    networks:
      - nextcloud_network

  nextcloud:
    container_name: nextcloud
    image: nextcloud:latest
    restart: unless-stopped
 #   ports:
 #     - 8080:80
    links:
      - nextcloud-db
    volumes:
      - /mnt/truenas/nextcloud/nextcloud:/var/www/html
      - /mnt/truenas/nextcloud/apps:/var/www/html/custom_apps
      - /mnt/truenas/nextcloud/config:/var/www/html/config
      - /mnt/truenas/nextcloud/data:/var/www/html/data
    environment:
      - MYSQL_PASSWORD=SeaBass7!
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=nextcloud-db
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.cvlab.net nextcloud.cv-laboratories.com
    networks:
      - nextcloud_network
        
  next-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: next-cloudflare-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=eyJhIjoiYzJkNmNmYzlkZDk0MjljYmQyZjIxYTM1YTI3NTliOWEiLCJ0IjoiYmI1NjRmYmMtODljYi00YWNkLTllYjEtYjc4YTk1Yjk1ZjE4IiwicyI6IlpEZGxPRFV4WXpZdFl6STNPUzAwTjJSaUxUbGlNelF0TW1RM01EVmlZVEptTmpGaCJ9
    networks:
      - external

networks:
  nextcloud_network:
    external: true
  external:
    external: true
     