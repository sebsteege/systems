- name: Disable password-based SSH access and enable public key authentication
  hosts: Debian12_Template
  become: true
  gather_facts: False

  tasks:

    - name: Ensure nfs-common is installed
      apt:
        name: nfs-common 
        state: present

    - name: Create a directory if it does not exist
      ansible.builtin.file:
        path: /mnt/truenas
        state: directory
        mode: '0755'

    - name: Mount NFS volumes
      ansible.posix.mount:
        src: 192.168.100.17:/mnt/Volume-01/Docker
        path: /mnt/truenas
        opts: rw
        state: mounted
        fstype: nfs