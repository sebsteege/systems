- name: Manage UFW firewall rules related to k3s cluster
  hosts: pd-k3s
  become: true
  vars_files:
    - ports.yml
  gather_facts: False

  tasks:

    # Mount NFS Share

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    - community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ tcp_ports }}"

    - community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: udp
      loop: "{{ udp_ports }}"