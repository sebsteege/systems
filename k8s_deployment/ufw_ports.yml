- name: Manage UFW firewall rules
  hosts: k8s-cluster-1
  become: true
  gather_facts: False

  tasks:

    - name: Install UFW firewall package
      ansible.builtin.apt:
        name: ufw
        update_cache: yes
        state: latest

    - name: Enable tcp ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ ufw_tcp_ports }}"
      when: ufw_tcp_ports is defined

    - name: enable udp ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: udp
      loop: "{{ ufw_udp_ports }}"
      when: ufw_udp_ports is defined

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        default: deny
